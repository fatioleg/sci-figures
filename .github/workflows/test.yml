name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  D2_VERSION: "0.9.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies (lock)
        run: python -m pip install -r requirements.txt
      - name: Install D2
        run: |
          curl -sSL -o d2.tgz "https://github.com/d2lang/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/d2" && tar -xzf d2.tgz -C "$HOME/.local/d2" --strip-components=1
          echo "$HOME/.local/d2/bin" >> "$GITHUB_PATH"
      - name: Doctor
        run: python sci-figures/scripts/figs.py doctor || true
      - name: Tests
        run: python -m unittest discover -s tests -v
